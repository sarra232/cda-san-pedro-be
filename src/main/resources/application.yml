spring:
  application:
    name: cda-san-pedro-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Seguridad JWT & CORS
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok-free.dev,https://*.vercel.app}
  mail:
    from-name: ${MAIL_FROM_NAME:CDA San Pedro}
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:notificaciones@cdasanpedro.com}}
  sms:
    android-gateway-url: ${ANDROID_SMS_GATEWAY_URL:}
    android-gateway-token: ${ANDROID_SMS_GATEWAY_TOKEN:}
  notificaciones:
    tesoreria:
      cron: ${NOTIFICACIONES_TESORERIA_CRON:0 0 8 * * ?}
      emails: ${NOTIFICACIONES_TESORERIA_EMAILS:administracion@cdasanpedro.com,gerencia@cdasanpedro.com}
      telefonos: ${NOTIFICACIONES_TESORERIA_TELEFONOS:3000000000}

# Integración Facturación Electrónica DIAN / SIIGO Cloud API
siigo:
  api-url: ${SIIGO_API_URL:https://api.siigo.com/v1}
  username: ${SIIGO_USERNAME:}
  access-key: ${SIIGO_ACCESS_KEY:}
  environment: ${SIIGO_ENVIRONMENT:SANDBOX}
  document-type-id: ${SIIGO_DOCUMENT_TYPE_ID:24581}
  seller-id: ${SIIGO_SELLER_ID:}
  cost-center-code: ${SIIGO_COST_CENTER_CODE:}


