services:
  postgres:
    image: postgres:16-alpine
    container_name: cda_san_pedro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cda_db}
      POSTGRES_USER: ${DB_USER:-cda_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cda_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cda_user} -d ${DB_NAME:-cda_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
