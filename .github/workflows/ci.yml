name: Backend CI - CDA San Pedro

on:
  push:
    branches: [ main ]
    paths:
      - 'cda-san-pedro-be/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cda-san-pedro-be/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    name: Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify build & run unit tests
        run: |
          mvn clean test --batch-mode

      - name: Package JAR artifact
        run: |
          mvn package -DskipTests=true --batch-mode
